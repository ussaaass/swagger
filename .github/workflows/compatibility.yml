name: Compatibility

on:
  push:
    branches:
      - master
      - 'compat/**'
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} / swagger-php ${{ matrix.swagger }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4', '8.5']
        swagger: ['4', '6']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
      - name: Install swagger-php 4.x
        if: matrix.swagger == '4'
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Install swagger-php 6.x
        if: matrix.swagger == '6'
        run: COMPOSER=composer.swagger-php-6.json composer update --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit -c phpunit.xml.dist
